name: Deploy Next.js site

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15

    defaults:
      run:
        working-directory: /var/www/sliot/SLIoT-Challenge-2025

    steps:
      - name: Pull latest changes
        run: |
          echo "=== Pulling latest changes ==="
          git fetch origin main
          git reset --hard origin/main

      - name: Check toolchain
        run: |
          node -v
          node -e "const [a,b]=process.versions.node.split('.').map(Number); if (a < 20 || (a === 20 && b < 9)) { console.error('Next.js 16 needs Node >= 20.9'); process.exit(1); }"
          # pnpm version is pinned by "packageManager" in package.json
          if ! command -v pnpm >/dev/null 2>&1; then
            corepack enable --install-directory "$HOME/.local/bin" pnpm
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          command -v pm2 >/dev/null 2>&1 || { echo "PM2 is not installed on the runner: npm install -g pm2"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Restart server
        run: |
          # When a job ends, the self-hosted runner kills every process that carries this
          # job's RUNNER_TRACKING_ID. Without clearing it, PM2 and the Next.js server get
          # killed right after a successful deploy and nginx returns 502.
          # (--update-env copies this shell's environment into the app, so it must be
          # cleared before the reload as well as before a fresh start.)
          export RUNNER_TRACKING_ID=""
          pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
          pm2 save

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/ || true)
            if [ "$code" = "200" ]; then echo "=== Deployment complete ==="; exit 0; fi
            sleep 2
          done
          echo "Site did not respond with 200 after restart"; pm2 logs sliot-web --lines 50 --nostream; exit 1
